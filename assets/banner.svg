<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #a5b4fc; }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 7s ease-in-out infinite; }
    .pulsing-glow { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200" />
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300" />
  </g>

  <!-- Background Glowing Circles -->
  <circle cx="200" cy="150" r="140" fill="url(#glowGrad)" class="pulsing-glow" />
  <circle cx="1000" cy="100" r="180" fill="url(#accentGrad)" opacity="0.15" class="pulsing-glow" />

  <!-- Flow Diagrams / Feed Data Animation (Right side graphic) -->
  <g transform="translate(750, 40)">
    <!-- Connection lines -->
    <path d="M100 70 L220 40 M100 110 L220 110 M100 150 L220 180" stroke="url(#accentGrad)" stroke-width="3" fill="none" class="animated-line" />
    
    <!-- Source Feed Card -->
    <g class="floating-card-1">
      <rect x="0" y="60" width="120" height="100" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <rect x="15" y="78" width="60" height="8" rx="4" fill="#6366f1" />
      <rect x="15" y="96" width="90" height="6" rx="3" fill="#64748b" />
      <rect x="15" y="110" width="75" height="6" rx="3" fill="#64748b" />
      <rect x="15" y="124" width="80" height="6" rx="3" fill="#64748b" />
      <circle cx="100" cy="82" r="6" fill="#22c55e" />
    </g>

    <!-- Target Channel Cards -->
    <g class="floating-card-2" transform="translate(210, 0)">
      <!-- Google Shopping / Marketplace 1 -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="150" height="45" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
        <circle cx="24" cy="22.5" r="10" fill="#ea4335" />
        <rect x="44" y="15" width="80" height="6" rx="3" fill="#f8fafc" />
        <rect x="44" y="25" width="50" height="5" rx="2.5" fill="#94a3b8" />
      </g>
      
      <!-- Meta / Marketplace 2 -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="150" height="45" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
        <circle cx="24" cy="22.5" r="10" fill="#0666e5" />
        <rect x="44" y="15" width="80" height="6" rx="3" fill="#f8fafc" />
        <rect x="44" y="25" width="60" height="5" rx="2.5" fill="#94a3b8" />
      </g>

      <!-- Amazon / Marketplace 3 -->
      <g transform="translate(0, 155)">
        <rect x="0" y="0" width="150" height="45" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
        <circle cx="24" cy="22.5" r="10" fill="#ff9900" />
        <rect x="44" y="15" width="70" height="6" rx="3" fill="#f8fafc" />
        <rect x="44" y="25" width="40" height="5" rx="2.5" fill="#94a3b8" />
      </g>
    </g>
  </g>

  <!-- Left Content / Title -->
  <g transform="translate(70, 75)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="140" y="21" text-anchor="middle" class="badge">🛒 E-COMMERCE &amp; FEED SYNDICATION</text>

    <!-- Main Heading -->
    <text x="0" y="85" class="title">Awesome Product Feed Management</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Curated SaaS Platforms &amp; Open-Source Projects for Catalog Optimization</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#1e293b" />
      <text x="70" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">⚡ Google Shopping</text>

      <rect x="150" y="0" width="130" height="28" rx="6" fill="#1e293b" />
      <text x="215" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a855f7" font-weight="600">🛍️ Marketplaces</text>

      <rect x="290" y="0" width="130" height="28" rx="6" fill="#1e293b" />
      <text x="355" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ec4899" font-weight="600">📦 PIM Integration</text>
    </g>
  </g>

  <!-- Bottom Accent Border Line -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
